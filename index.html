<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pacific SD | Tesla Model 3 Premium Long Range</title>

<style>

:root{
--ocean:#3d87c9;
--ocean-dark:#24639c;
--gold:#b9914a;
--sand:#f8f5ef;
--charcoal:#1f1f1f;
--white:#ffffff;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html{
scroll-behavior:smooth;
}

body{
font-family:Arial, Helvetica, sans-serif;
color:var(--charcoal);
background:white;
line-height:1.7;
}

/* HERO */

.hero{
min-height:100vh;

background:
linear-gradient(
rgba(0,0,0,.35),
rgba(0,0,0,.35)
),
url("pacificsd-exterior.jpg");

background-size:cover;
background-position:center;

display:flex;
align-items:center;
justify-content:center;

text-align:center;
color:white;

padding:40px;
}

.hero-content{
max-width:900px;
}

.logo{
font-size:18px;
letter-spacing:5px;
text-transform:uppercase;
color:var(--gold);
margin-bottom:20px;
}

.hero h1{
font-size:clamp(3rem,8vw,6rem);
font-weight:700;
margin-bottom:20px;
}

.hero h2{
font-size:clamp(1.2rem,4vw,2.5rem);
font-weight:300;
margin-bottom:30px;
}

.hero p{
font-size:1.2rem;
max-width:700px;
margin:0 auto 50px;
}

/* BUTTONS */

.button-row{
display:flex;
justify-content:center;
gap:20px;
flex-wrap:wrap;
}

.button{
display:inline-flex;
justify-content:center;
align-items:center;

padding:20px 42px;

border-radius:999px;

font-size:18px;
font-weight:700;

text-decoration:none;

transition:.3s;

min-width:240px;
}

.primary-button{

background:
linear-gradient(
135deg,
#63aef3,
#2f79be
);

color:white;

box-shadow:
0 20px 40px rgba(47,121,190,.35);
}

.primary-button:hover{
transform:translateY(-3px);
}

.secondary-button{

background:rgba(255,255,255,.20);

backdrop-filter:blur(10px);

border:1px solid rgba(255,255,255,.4);

color:white;
}

.secondary-button:hover{
background:rgba(255,255,255,.30);
}

/* SECTIONS */

.section{
padding:120px 30px;
}

.container{
max-width:1200px;
margin:auto;
}

.center{
text-align:center;
}

.section-title{
font-size:clamp(2.2rem,5vw,3.5rem);
margin-bottom:20px;
}

.section-subtitle{
max-width:850px;
margin:auto;
font-size:1.2rem;
color:#666;
}

.wave{
height:8px;

background:
linear-gradient(
90deg,
#61b0f2,
#9cd3ff,
#61b0f2
);
}

/* FEATURES */

.features{

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(280px,1fr));

gap:30px;

margin-top:60px;
}

.card{

padding:40px;

background:white;

border-radius:30px;

box-shadow:
0 15px 40px rgba(0,0,0,.08);
}

.card h3{
margin-bottom:15px;
color:var(--ocean-dark);
}

/* IMAGE SECTIONS */

.image-section{

min-height:700px;

background-size:cover;
background-position:center;

display:flex;
align-items:center;

color:white;
}

.image-overlay{

width:100%
